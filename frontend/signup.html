<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | KINETIC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">KINETIC<span>.</span></a>
  </nav>

  <div class="auth-container">
    <h2>Create Account</h2>
    <p>Join Kinetic to get started.</p>

    <div id="error-msg" class="error-msg"></div>

    <form onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="user@domain.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-orange" style="width: 100%; padding: 0.8rem;">Create Account</button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="signin.html">Sign In</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
