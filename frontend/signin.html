<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In | KINETIC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">KINETIC<span>.</span></a>
  </nav>

  <div class="auth-container">
    <h2>Welcome Back</h2>
    <p>Sign in to your account.</p>

    <div id="error-msg" class="error-msg"></div>

    <form onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="user@domain.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-orange" style="width: 100%; padding: 0.8rem;">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
